<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
      background: #fdfdfd;
      position: relative;
      color: #222;
      margin: 0;
      padding: 0;
    }

    /* ===== HEADER ===== */
    header {
      position: fixed;
      top: 0;
      z-index: 100;
      height: 70px;
      width:100%;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 80px;
    }

    .logo {
      height: 50px;
      width: 50px;
      border-radius: 50%;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 60px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      color: #0D1164;
      text-decoration: none;
      font-weight: 600;
      font-size: 20px;
      position: relative;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #f12a8d;
    }

    /* Hamburger */
    .menu-icon {
      font-size: 28px;
      color: #0D1164;
      cursor: pointer;
      display: none;
    }

    /* Mobile menu */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      height: 100vh;
      width: 250px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      padding: 20px;
      transition: right 0.4s ease-in-out;
      z-index: 200;
    }

    .mobile-menu.active { right: 0; }

    .mobile-menu a {
      text-decoration: none;
      color: #0D1164;
      font-size: 22px;
      font-weight: 600;
      padding: 12px 0;
    }

    .mobile-menu a:hover { color: #f12a8d; }

    .close-btn {
      font-size: 36px;
      cursor: pointer;
      align-self: flex-end;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      nav ul { display: none; }
      .menu-icon { display: block; }
    }

    /* ===== SECTION ===== */
    .home {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 100px 40px 40px; /* extra top padding for fixed header */
      color: #222;
    }

    .home-text {
      max-width: 520px;
      padding: 20px;
      font-size: 20px;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      color: #0D1164;
    }

    h2 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #FF007F;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav>
      <div class="nav-inner">
        <img src="./plogo.png" alt="Logo" class="logo">
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="menu-icon" onclick="toggleMenu()">
          <i class="fa-solid fa-bars"></i>
        </div>
      </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
      <span class="close-btn" onclick="toggleMenu()">&times;</span>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </div>
  </header>

  <!-- HOME SECTION -->
  <section class="home" id="home">
    <div class="home-text">
      <h1>Hello!</h1>
      <h2>I'm G.V.K. Sindhu</h2>
      <p>A creative Full stack developer passionate about building professional, modern, and user-friendly web applications.</p>
      <div class="buttons">
        <a href="#" class="btn">View Resume</a>
        <a href="#contact" class="btn">Let's Talk</a>
      </div>
    </div>
  </section>

  <!-- JS -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.classList.toggle("active");
    }
  </script>

</body>
</html>
